<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 布料模拟 - XPBD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #controls {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 20, 30, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      min-width: 280px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      z-index: 100;
    }
    #controls::-webkit-scrollbar {
      width: 4px;
    }
    #controls::-webkit-scrollbar-thumb {
      background: rgba(100, 181, 246, 0.3);
      border-radius: 2px;
    }
    #controls h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #64b5f6;
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-top: 12px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .control-group {
      margin-bottom: 8px;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .control-group .value {
      font-size: 11px;
      color: #64b5f6;
      float: right;
    }
    .control-group input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      appearance: none;
      cursor: pointer;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      background: #64b5f6;
      border-radius: 50%;
      cursor: pointer;
    }
    .control-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .control-buttons button {
      flex: 1;
      padding: 8px 12px;
      background: rgba(100, 181, 246, 0.2);
      border: 1px solid rgba(100, 181, 246, 0.4);
      border-radius: 6px;
      color: #64b5f6;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-buttons button:hover {
      background: rgba(100, 181, 246, 0.4);
    }
    .control-buttons button.active {
      background: #64b5f6;
      color: #fff;
    }
    #instructions {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      max-width: 300px;
      line-height: 1.5;
    }
    #info {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: right;
      line-height: 1.6;
    }
    #info span {
      color: #64b5f6;
    }
    #method-badge {
      display: inline-block;
      background: rgba(100, 181, 246, 0.2);
      border: 1px solid rgba(100, 181, 246, 0.4);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      color: #64b5f6;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-vkSYtnWS.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <h1>布料模拟控制面板 <span id="method-badge">XPBD</span></h1>

    <div class="section-title">约束参数（compliance 越小越硬）</div>
    <div class="control-group">
      <label>结构弹簧柔度 <span class="value" id="structK-val">1.0e-5</span></label>
      <input type="range" id="structK" min="0.000001" max="0.001" step="0.000001" value="0.00001">
    </div>
    <div class="control-group">
      <label>剪切弹簧柔度 <span class="value" id="shearK-val">1.0e-4</span></label>
      <input type="range" id="shearK" min="0.00001" max="0.01" step="0.00001" value="0.0001">
    </div>
    <div class="control-group">
      <label>弯曲弹簧柔度 <span class="value" id="bendK-val">1.0e-3</span></label>
      <input type="range" id="bendK" min="0.0001" max="0.1" step="0.0001" value="0.001">
    </div>

    <div class="section-title">物理参数</div>
    <div class="control-group">
      <label>阻尼系数 <span class="value" id="damping-val">0.995</span></label>
      <input type="range" id="damping" min="0.9" max="0.999" step="0.001" value="0.995">
    </div>
    <div class="control-group">
      <label>子步数 (XPBD) <span class="value" id="subSteps-val">8</span></label>
      <input type="range" id="subSteps" min="1" max="16" step="1" value="8">
    </div>
    <div class="control-group">
      <label>断裂阈值 <span class="value" id="breakThreshold-val">1.0</span></label>
      <input type="range" id="breakThreshold" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>

    <div class="section-title">环境</div>
    <div class="control-group">
      <label>风力强度 <span class="value" id="wind-val">3.0</span></label>
      <input type="range" id="wind" min="0" max="10" step="0.1" value="3.0">
    </div>
    <div class="control-group">
      <label>撕扯半径 <span class="value" id="tearRadius-val">3</span></label>
      <input type="range" id="tearRadius" min="1" max="8" step="1" value="3">
    </div>

    <div class="section-title">交互模式</div>
    <div class="control-buttons">
      <button id="modeDrag" class="active">拖拽</button>
      <button id="modeTear">撕扯</button>
      <button id="modeForce">施力</button>
    </div>
    <div class="control-buttons">
      <button id="reset">重置</button>
      <button id="pinToggle">固定四角</button>
    </div>
  </div>
  <div id="info">
    <div>FPS: <span id="fps">0</span></div>
    <div>质点: <span id="particles">16384</span></div>
    <div>弹簧: <span id="springs">0</span></div>
  </div>
  <div id="instructions">
    <strong>操作说明：</strong><br>
    • 拖拽模式：左键拖拽布料质点<br>
    • 撕扯模式：点击/拖动切断弹簧<br>
    • 施力模式：点击施加向外的力<br>
    • W：切换线框 | S：切换应力图<br>
    • 1/2/3：切换模式 | R：重置
  </div>
</body>
</html>
