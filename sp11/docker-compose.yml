version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: co-code-postgres
    environment:
      POSTGRES_USER: cocode
      POSTGRES_PASSWORD: cocode2024
      POSTGRES_DB: cocode
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocode"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: co-code-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-65535:49152-65535/udp"
    environment:
      - TURN_USERNAME=cocode
      - TURN_PASSWORD=cocode2024
    command:
      - --min-port=49152
      - --max-port=65535
      - --fingerprint
      - --lt-cred-mech
      - --user=cocode:cocode2024
      - --realm=cocode
      - --verbose
    network_mode: host

volumes:
  postgres-data:
