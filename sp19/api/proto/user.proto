syntax = "proto3";

package user;

option go_package = "recommendation-system/api/proto/user";

import "google/api/annotations.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/{user_id}"
      body: "*"
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{user_id}"
    };
  }

  rpc RecordBrowseHistory(BrowseHistoryRequest) returns (BrowseHistoryResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/browse"
      body: "*"
    };
  }

  rpc GetBrowseHistory(GetBrowseHistoryRequest) returns (GetBrowseHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/browse"
    };
  }
}

message User {
  int64 user_id = 1;
  string username = 2;
  string email = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message GetUserRequest {
  int64 user_id = 1;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
}

message UpdateUserRequest {
  int64 user_id = 1;
  string username = 2;
  string email = 3;
}

message DeleteUserRequest {
  int64 user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message BrowseHistoryRequest {
  int64 user_id = 1;
  int64 product_id = 2;
}

message BrowseHistoryResponse {
  bool success = 1;
}

message GetBrowseHistoryRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

message GetBrowseHistoryResponse {
  repeated int64 product_ids = 1;
}
